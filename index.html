<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>To Do List Mahasiswa</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <header>
        <h1>📝 TO DO</h1>
      </header>

      <div class="input-box">
        <input
          type="text"
          id="taskInput"
          placeholder="Tambah tugas mata kuliah..."
        />
        <button onclick="addTask()">＋</button>
      </div>

      <ul id="taskList"></ul>

      <div class="info">
        Total: <span id="total">0</span> | Selesai: <span id="done">0</span>
      </div>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
